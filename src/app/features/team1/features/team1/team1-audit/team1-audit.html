<div class="audit-container">

  <h3>Transaction Audit Log</h3>

  <table>
    <thead>
      <tr>
        <th>Tx ID</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Approved By</th>
        <th>Approved At</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      @for (log of auditLogs(); track log.id) {
        <tr>
          <td>{{ log.id }}</td>
          <td>{{ log.type }}</td>
          <td>${{ log.amount }}</td>
          <td>{{ log.approvedBy }}</td>
          <td>{{ log.approvedAt | date:'short' }}</td>
          <td>
            <span class="action-badge" [ngClass]="log.action.toLowerCase()">
              {{ log.action }}
            </span>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
